[project]
name = "trackflow-api"
version = "0.1.0"
description = "TrackFlow FastAPI authentication service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic-settings==2.5.2",
    "email-validator==2.2.0",
    "tinydb==4.8.0",
    "httpx==0.27.2",
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
